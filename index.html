<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Phase 10 Scorekeeper</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-colour" content="#007aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Phase 10">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://kit.fontawesome.com/b8655f32ca.js" crossorigin="anonymous"></script>

<style>
body {
  background: #f5f5f5;
  padding: 16px;
}

h1, h2 {
  text-align: center;
  margin-bottom: 1rem;
}

.counter span {
  min-width: 32px;
  display: inline-block;
  text-align: center;
  font-weight: bold;
  font-size: 1.1rem;
}

.rubber-match-banner {
  display: none;
  margin-bottom: 1rem;
  font-weight: bold;
  font-size: 1.2rem;
}
footer {
  font-size: 0.85rem;
  opacity: 0.7;
}

</style>
</head>
<body>

<div class="container">

<h1>Phase 10 Scorekeeper</h1>

<!-- Rubber Match Banner -->
<div id="rubberBanner" class="alert alert-danger text-center rubber-match-banner">
  🔥 RUBBER MATCH! Winner takes all!
</div>

<!-- SETUP -->
<div id="setup" class="card p-4 mb-4">
  <h2>Add Players</h2>
  <div class="input-group mb-3">
    <input id="playerName" class="form-control" placeholder="Player name">
    <button class="btn btn-primary" onclick="addPlayer()"><i class="fa-duotone fa-solid fa-plus"></i> Add</button>
  </div>
  <ul id="playerList" class="list-group mb-3"></ul>
  <div class="mb-3">
    <label for="phaseCount" class="form-label">How many phases?</label>
    <select id="phaseCount" class="form-select">
      <option value="1">1 phase</option>
      <option value="2">2 phases</option>
      <option value="3">3 phases</option>
      <option value="4">4 phases</option>
      <option value="5">5 phases</option>
      <option value="6">6 phases</option>
      <option value="7">7 phases</option>
      <option value="8">8 phases</option>
      <option value="9">9 phases</option>
      <option value="10" selected>10 phases</option>
    </select>
    <div class="form-text">Play from phase 1 through your chosen final phase.</div>
  </div>
  <button class="btn btn-success w-100" onclick="startGame()"><i class="fa-duotone fa-solid fa-play"></i> Start Game</button>
</div>

<!-- GAME -->
<div id="game" class="d-none mb-4">
  <h2>Game Board</h2>
  <p id="phaseCountSummary" class="text-center text-muted"></p>
  <div id="rendering-game" class="row g-3 mb-3"><!--  When we are rendering the game board let's show in a div little easter egg messages--></div>
  <div id="players" class="row g-3 mb-3"></div>
  <div id="system-buttons" class="d-flex justify-content-between flex-wrap">
    <button class="btn btn-secondary mb-2" id="undoRoundButton" onclick="undoRound()"><i class="fa-duotone fa-solid fa-arrow-rotate-left"></i> Undo Last Round</button>
    <button class="btn btn-warning mb-2" onclick="resetScores()"><i class="fa-duotone fa-solid fa-trash-undo"></i> Let’s Go Again</button>
    <button class="btn btn-danger mb-2" onclick="newGame()"><i class="fa-duotone fa-solid fa-sparkles"></i> New Game</button>
  </div>
</div>

<!-- SCORING -->
<div id="scoring" class="d-none">
  <h2>End of Round</h2>
  <div id="scoreInputs" class="row g-3"></div>
  <button class="btn btn-primary w-100 mt-3" onclick="finaliseScores()"><i class="fa-duotone fa-solid fa-arrow-right"></i> Next Round</button>
</div>

<footer class="text-center mt-4 mb-2 text-muted small">
  Made with ❤️ by <a href="https://www.lancensolomon.com.au" target="_blank" rel="noopener noreferrer">Lance N. Solomon</a>
  <br>
</footer>


</div>

<script>
let players = [];
let roundEndedBy = null;
let history = [];
let roundScores = {};
let gameOver = false;
let totalPhases = 10;
let phaseAdvancedThisRound = {}; // track which players have advanced phase this round

// DOM references
const playersDiv = document.getElementById('players');
const renderingGameEasterEggs = document.getElementById('rendering-game');
const playerList = document.getElementById('playerList');
const setup = document.getElementById('setup');
const game = document.getElementById('game');
const scoring = document.getElementById('scoring');
const rubberBanner = document.getElementById('rubberBanner');
const phaseCountSelect = document.getElementById('phaseCount');
const phaseCountSummary = document.getElementById('phaseCountSummary');
const systemButtons = document.getElementById('system-buttons');

//pre-load all icons
const iconsToPreload = [
  'fa-plus',
  'fa-play',
  'fa-hand-point-left',
  'fa-check',
  'fa-arrows-rotate-reverse',
  'fa-flag-checkered',
  'fa-minus',
  'fa-plus',
  'fa-arrow-rotate-left',
  'fa-trash-undo',
  'fa-sparkles',
  'fa-angle-right',
  'fa-angle-left',
  'fa-gamepad',
  'fa-fire',
  'fa-explosion',
  'fa-bolt',
  'fa-rocket',
  'fa-flag-checkered',
  'fa-bullseye-arrow',
  'fa-trophy',
  'fa-sparkle',
  'fa-arrow-right'
];
iconsToPreload.forEach(icon => {
  const i = document.createElement('i');
  i.className = `fa-duotone fa-solid ${icon}`;
  i.style.display = 'none';
  document.body.appendChild(i);
});

/* ---------- Persistence ---------- */
function saveGame() {
  localStorage.setItem('phase10Game', JSON.stringify({ players, history, gameOver, phaseAdvancedThisRound, totalPhases }));
}
function loadGame() {
  const data = localStorage.getItem('phase10Game');
  if (!data) return;

  const parsed = JSON.parse(data);
  totalPhases = validPhaseCount(parsed.totalPhases);
  phaseCountSelect.value = String(totalPhases);
  players = parsed.players || [];
  history = parsed.history || [];
  gameOver = parsed.gameOver || false;
  phaseAdvancedThisRound = parsed.phaseAdvancedThisRound || {};

  if (players.length) {
    setup.classList.add('d-none');
    game.classList.remove('d-none');
    renderGame();
  }
}
loadGame();

/* ---------- Setup ---------- */
function addPlayer() {
  const name = playerName.value.trim();
  if (!name) return;

  players.push({ name, phase: 1, score: 0, matchWins: 0 });
  playerName.value = '';
  renderPlayerList();
  //Return cursor to input field
  playerName.focus();
}

function renderPlayerList() {
  playerList.innerHTML = '';
  players.forEach(p => {
    const li = document.createElement('li');
    li.className = 'list-group-item';
    li.textContent = p.name;
    playerList.appendChild(li);
  });
}

function validPhaseCount(value) {
  const count = Number(value);
  return Number.isInteger(count) && count >= 1 && count <= 10 ? count : 10;
}

function startGame() {
  if (players.length < 2) return alert('Add at least 2 players');
  totalPhases = validPhaseCount(phaseCountSelect.value);
  setup.classList.add('d-none');
  game.classList.remove('d-none');
  saveGame();
  renderGame();
}

/* ---------- Game Board ---------- */
function renderGame(fadeIn = false) {
  const fadeTime = 1500;
  phaseCountSummary.textContent = `Playing ${totalPhases} ${totalPhases === 1 ? 'phase' : 'phases'} — finish phase ${totalPhases} to win.`;
  playersDiv.innerHTML = '';
  renderingGameEasterEggs.innerHTML = '';

  //if we are fading in, then we show and hide things. Fade in, only happens at the start/end of a round
  if(fadeIn && !gameOver) {
    //Scroll to the top of the game board
    window.scrollTo({ top: game.offsetTop, behavior: 'smooth' });

    //We hide the system buttons whilst we render the Game
    systemButtons.classList.add('d-none');
    const easterEggMessages = [
      '<i class="fa-duotone fa-solid fa-angle-right"></i> Next Round! <i class="fa-duotone fa-solid fa-angle-left"></i>',
      '<i class="fa-duotone fa-solid fa-gamepad"></i> Get Ready! <i class="fa-duotone fa-solid fa-gamepad"></i>',
      '<i class="fa-duotone fa-solid fa-fire"></i> Fight! <i class="fa-duotone fa-solid fa-fire"></i>',
      '<i class="fa-duotone fa-solid fa-explosion"></i> Let\'s Go! <i class="fa-duotone fa-solid fa-explosion"></i>',
      '<i class="fa-duotone fa-solid fa-bolt"></i> Power Up! <i class="fa-duotone fa-solid fa-bolt"></i>',
      '<i class="fa-duotone fa-solid fa-rocket"></i> Blast Off! <i class="fa-duotone fa-solid fa-rocket"></i>',
      '<i class="fa-duotone fa-solid fa-flag-checkered"></i> On Your Marks! <i class="fa-duotone fa-solid fa-flag-checkered"></i>',
      '<i class="fa-duotone fa-solid fa-bullseye-arrow"></i> Aim High! <i class="fa-duotone fa-solid fa-bullseye-arrow"></i>',
      '<i class="fa-duotone fa-solid fa-trophy"></i> Go for Gold! <i class="fa-duotone fa-solid fa-trophy"></i>',
      '<i class="fa-duotone fa-solid fa-sparkle"></i> Shine On! <i class="fa-duotone fa-solid fa-sparkle"></i>'
    ];

    const randomMessage = easterEggMessages[Math.floor(Math.random() * easterEggMessages.length)];

    const nextRoundDiv = document.createElement('div');
    nextRoundDiv.className = 'alert alert-info text-center w-100';
    nextRoundDiv.innerHTML = randomMessage;
    renderingGameEasterEggs.appendChild(nextRoundDiv);
    setTimeout(() => {
      renderingGameEasterEggs.removeChild(nextRoundDiv);
    }, fadeTime);

    playersDiv.style.opacity = 0;
    setTimeout(() => {
      playersDiv.style.transition = 'opacity 2s';
      playersDiv.style.opacity = 1;
    }, fadeTime);
  }

  document.getElementById('undoRoundButton').disabled = gameOver;
  if (gameOver) playersDiv.style.opacity = 1;

  const maxMatchWins = Math.max(...players.map(p => p.matchWins));
  const seriesTied = players.filter(p => p.matchWins === maxMatchWins).length > 1;

  rubberBanner.style.display = (seriesTied && maxMatchWins === 1) ? 'block' : 'none';

  players.forEach((p, i) => {
    let whatPhase = whatPhaseNumber(p.phase);

    const phaseBadge = p.phase > totalPhases
            ? `<span class="w-100 badge bg-success">Phase ${totalPhases} completed — ${whatPhaseNumber(totalPhases)}</span>`
            : `<span class="w-100 badge bg-primary">Phase: ${p.phase} - ${whatPhase}</span>`;

    const col = document.createElement('div');
    //If we are on a md screen show 2 players per row, if lg show 4 per row
    if (window.innerWidth >= 992) {
      col.classList.add('col-lg-3');
    } else if (window.innerWidth >= 768) {
      col.classList.add('col-md-6');
    }else{
      col.classList.add('col-12');
    }

    const phaseAdvanceButton = phaseAdvancedThisRound[i]
      ? `<button class="btn btn-sm btn-outline-danger w-100 h-100" ${gameOver ? 'disabled' : ''} onclick="changePhase(${i}, -1)"><i class="fa-duotone fa-solid fa-arrows-rotate-reverse"></i> Strike that, reverse it</button>`
      : `<button class="btn btn-sm btn-outline-success me-1 w-100" ${gameOver ? 'disabled' : ''} onclick="changePhase(${i}, 1)"><i class="fa-duotone fa-solid fa-check"></i> Phase ${Math.min(totalPhases, p.phase)} completed</button>`;

    col.innerHTML = `
      <div class="card p-2 h-100">
        <div class="row">
          <div class="col-9 text-start">${p.name}</div>
          <div class="col-3 text-end">${p.score} <i class="fa-duotone fa-solid fa-hand-point-left"></i></div>
        </div>
        <div class="row">
          <div class="col-12 text-center">
              ${phaseBadge}
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-6">
            ${phaseAdvanceButton}
            </div>
            <div class="col-6">
            <button class="btn btn-sm btn-outline-success w-100 h-100 " ${gameOver ? 'disabled' : ''} onclick="wentOut(${i})"><i class="fa-duotone fa-thin fa-flag-checkered"></i> I Went Out</button>
          </div>
        </div>
      </div>
    `;
    playersDiv.appendChild(col);
  });
  setTimeout(() => {
    systemButtons.classList.remove('d-none');
  }, fadeTime);
}

function whatPhaseNumber(phase) {
  const phases = [
    '2 sets of 3',
    '1 set of 3 + 1 run of 4',
    '1 set of 4 + 1 run of 4',
    '1 run of 7',
    '1 run of 8',
    '1 run of 9',
    '2 sets of 4',
    '7 cards of one colour',
    '1 set of 5 + 1 set of 2',
    '1 set of 5 + 1 set of 3'
  ];
  return phases[phase - 1] || '';
}

function changePhase(i, d) {
  if (gameOver) return;

  // Initialize tracking for this round if not present
  if (phaseAdvancedThisRound[i] === undefined) phaseAdvancedThisRound[i] = false;

  if (d > 0) {
    // Check if player has already advanced their phase this round
    if (phaseAdvancedThisRound[i]) {
      alert('You can only advance your phase once per round!');
      return;
    }
    // Mark as advanced
    phaseAdvancedThisRound[i] = true;
  } else if (d < 0) {
    // If player decreases phase, allow them to advance again
    phaseAdvancedThisRound[i] = false;
  }

  // Apply the change
  players[i].phase = Math.max(1, Math.min(totalPhases + 1, players[i].phase + d));

  saveGame();
  renderGame();
}

/* ---------- Round End ---------- */
function wentOut(i) {
  //Confirm they want to end the round
    if (gameOver) return;
    if (!confirm(`${players[i].name}, are you sure you want to end the round?`)) return;

  roundEndedBy = i;
  //When you go out, check if they have gone out on the phase too, otherwise also advance their phase
    if (!phaseAdvancedThisRound[i]) {
        players[i].phase = Math.min(totalPhases + 1, players[i].phase + 1);
        phaseAdvancedThisRound[i] = true;
    }
  history.push(JSON.parse(JSON.stringify(players)));

  roundScores = {};
  players.forEach((_, idx) => {
    if (idx !== i) roundScores[idx] = { n: 0, t: 0, s: 0, w: 0 };
  });

  game.classList.add('d-none');
  scoring.classList.remove('d-none');
  renderScoring();
  phaseAdvancedThisRound = {}; // reset for next round
}

function renderScoring() {
  scoreInputs.innerHTML = '';

  //If we are on a md screen show the scores per row same as players
  let scoreInputsColumns = '';
  if (window.innerWidth >= 992) {
    scoreInputsColumns = 'col-lg-3';
  } else if (window.innerWidth >= 768) {
    scoreInputsColumns = 'col-md-6';
  }else{
    scoreInputsColumns = 'col-12';
  }

  players.forEach((p, i) => {
    if (i === roundEndedBy) {
      scoreInputs.innerHTML += `<div class="${scoreInputsColumns}">
    <div class="card p-2 mb-2">
    <p><strong>${p.name}</strong>: Went out (0)</p>
    </div>
    </div>`;
      return;
    }
    const r = roundScores[i];

    scoreInputs.innerHTML += `
        <div class="${scoreInputsColumns}">
      <div class="card p-2 mb-2">
        <p class="small text-muted">If multiple players complete phase ${totalPhases}, lowest score wins</p>
        <h6>${p.name}</h6>
        ${counterRow(i, '1–9 (5)', 'n', r.n)}
        ${counterRow(i, '10–12 (10)', 't', r.t)}
        ${counterRow(i, 'Skips (15)', 's', r.s)}
        ${counterRow(i, 'Wilds (25)', 'w', r.w)}
      </div>
      </div>
    `;
  });
}

function counterRow(i, label, key, value) {
  return `
    <div class="d-flex align-items-center mb-1">
      <span class="me-2">${label}</span>
      <div class="btn-group btn-group-sm ms-auto">
        <button class="btn btn-outline-secondary" onclick="adjust(${i}, '${key}', -1)"><i class="fa-duotone fa-solid fa-minus"></i></button>
        <span class="px-2">${value}</span>
        <button class="btn btn-outline-secondary" onclick="adjust(${i}, '${key}', 1)"><i class="fa-duotone fa-solid fa-plus"></i></button>
      </div>
    </div>
  `;
}

function adjust(i, key, d) {
  roundScores[i][key] = Math.max(0, roundScores[i][key] + d);
  renderScoring();
}

function finaliseScores() {
  players.forEach((p, i) => {
    if (i === roundEndedBy) return;
    const r = roundScores[i];
    p.score += (r.n * 5) + (r.t * 10) + (r.s * 15) + (r.w * 25);
  });

  scoring.classList.add('d-none');
  game.classList.remove('d-none');
  roundEndedBy = null;

  checkWinner();
  saveGame();
  renderGame(true);
}

/* ---------- Winner ---------- */
function checkWinner() {
  if (gameOver) return;
  const finalists = players.filter(p => p.phase > totalPhases);
  if (!finalists.length) return;

  const winner = finalists.reduce((best, p) => p.score < best.score ? p : best);

  winner.matchWins += 1;
  gameOver = true;
  saveGame();

  if (winner.matchWins >= 2) {
    alert(`🏆 ${winner.name} wins the BEST OF 3 SERIES!\nLowest score takes it.`);
  } else {
    alert(`🎉 ${winner.name} wins this game! (${finalists.length} players completed phase ${totalPhases} — lowest score wins)`);
  }
}

/* ---------- Undo / Reset ---------- */
function undoRound() {
  if (gameOver) return;
  if (!history.length) return alert('Nothing to undo');
  players = history.pop();
  gameOver = false;
  saveGame();
  renderGame();
}

function resetScores() {
  if (!confirm('Let’s go again? Reset scores and phases, keeping players and match wins.')) return;
  initialiseState(true);
  saveGame();
  renderGame();
}

function newGame() {
  if (!confirm('Start a brand new game? All players will be removed.')) return;
  initialiseState(false);
  localStorage.removeItem('phase10Game');
  playerList.innerHTML = '';
  scoreInputs.innerHTML = '';
  playersDiv.innerHTML = '';
  setup.classList.remove('d-none');
  game.classList.add('d-none');
  scoring.classList.add('d-none');
}

function initialiseState(keepPlayers = false) {
  if (keepPlayers) {
    players = players.map(p => ({
      name: p.name,
      phase: 1,
      score: 0,
      matchWins: p.matchWins || 0
    }));
  } else {
    players = [];
    totalPhases = 10;
    phaseCountSelect.value = '10';
  }

  phaseAdvancedThisRound = [];
  roundEndedBy = null;
  history = [];
  roundScores = {};
  gameOver = false;
}

function seriesDots(wins) {
  return '●'.repeat(wins) + '○'.repeat(2 - wins);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js');
  });
}

navigator.serviceWorker?.addEventListener('controllerchange', () => {
  window.location.reload();
});

//When #setup is visible, focus on the playerName input and allow enter as an add player shortcut
if (setup) {
  playerName.focus();
  playerName.addEventListener('keyup', function(event) {
    //if the input is empty then hit the start button
    if (event.key === 'Enter' && playerName.value.trim() === '') {
      startGame();
    }
    if (event.key === 'Enter') {
      addPlayer();
    }
  });
}
</script>

</body>
</html>
